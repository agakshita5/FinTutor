<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinTutor</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Inter', system-ui, sans-serif;
      background:linear-gradient(135deg,#00c6ff 0%,#00736d 100%);
      min-height:100vh; color:#222;
    }

    /* Main Layout */
    .main-container {
      display:flex; height:100vh;
    }

    /* Sidebar */
    .sidebar {
      width:280px; background:rgba(0,0,0,0.3); backdrop-filter:blur(10px);
      padding:20px; overflow-y:auto; transition:all .3s;
      border-right:1px solid rgba(255,255,255,0.2);
    }
    .sidebar.collapsed { width:0; padding:0; overflow:hidden; }
    .sidebar-header {
      color:white; font-size:18px; font-weight:600; margin-bottom:20px;
      display:flex; justify-content:space-between; align-items:center;
    }
    .new-chat-btn {
      width:100%; padding:10px; margin-bottom:15px; background:rgba(255,255,255,0.2);
      border:none; border-radius:8px; color:white; cursor:pointer; font-size:14px;
    }
    .new-chat-btn:hover { background:rgba(255,255,255,0.3); }
    .sidebar-note { color:rgba(255,255,255,0.7); font-size:12px; margin-bottom:10px; }
    .chat-history-item {
      background:rgba(255,255,255,0.1); padding:12px; margin:10px 0;
      border-radius:10px; color:white; cursor:pointer;
      transition:all .2s; font-size:14px;
    }
    .chat-history-item:hover { background:rgba(255,255,255,0.2); }
    .chat-history-item small { opacity:0.7; display:block; margin-top:5px; }

    /* Chat Area */
    .chat-container {
      flex:1; display:flex; flex-direction:column;
    }
    .chat-header {
      padding:20px; background:rgba(255,255,255,0.2);
      border-bottom:1px solid rgba(255,255,255,0.3);
      display:flex; align-items:center; justify-content:space-between;
    }
    .chat-header h1 { color:white; font-size:24px; }
    .toggle-sidebar-btn {
      background:rgba(255,255,255,0.2); border:none; padding:10px 15px;
      border-radius:8px; color:white; cursor:pointer; font-size:18px;
    }
    .toggle-sidebar-btn:hover { background:rgba(255,255,255,0.3); }
    .status { font-size:14px; margin-left:15px; }
    .status.ok{color:#10b981;} .status.offline{color:#ef4444;}

    #chatMessages{flex:1;overflow-y:auto;padding:20px;scrollbar-width:thin;}
    .message{display:flex;margin-bottom:15px;animation:fadeIn .4s ease;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    .message-content{
      padding:12px 18px;border-radius:18px;max-width:70%;line-height:1.5;
      word-wrap:break-word;white-space:pre-wrap;font-size:15px;
    }
    .message.user{justify-content:flex-end;}
    .message.user .message-content{
      background:rgba(0,191,165,0.9);color:#fff;
      box-shadow:0 4px 15px rgba(0,191,165,0.5);
    }
    .message.bot .message-content{
      background:rgba(255,255,255,0.2);color:#f8f9ff;backdrop-filter:blur(10px);
    }
    .message.bot.no-match .message-content{ border:1px dashed rgba(255,255,255,0.6); }
    .sources{ margin-top:10px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.3);
      font-size:12px; opacity:0.85; white-space:normal; }
    .sources ol{ margin:4px 0 0 18px; }
    .loading{display:flex;gap:6px;align-items:center;padding:10px;}
    .loading-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:bounce 1.4s infinite ease-in-out both;}
    .loading-dot:nth-child(1){animation-delay:-.32s;}
    .loading-dot:nth-child(2){animation-delay:-.16s;}
    @keyframes bounce{0%,80%,100%{transform:scale(0);}40%{transform:scale(1);}}

    .chat-input-area{
      padding:20px;background:rgba(255,255,255,0.2);
      border-top:1px solid rgba(255,255,255,0.3);
      display:flex;gap:10px;align-items:center;
    }
    .chat-input-area input{
      flex:1;padding:12px 18px;border:none;border-radius:25px;
      font-size:15px;background:rgba(255,255,255,0.8);outline:none;color:#333;
    }
    .btn{
      border:none;padding:12px 24px;border-radius:25px;
      font-weight:600;cursor:pointer;
      background:linear-gradient(135deg,#00bfa5,#00796b);
      color:white;transition:all .3s;
    }
    .btn:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,191,165,0.4);}
    .mic-btn{
      border:none;border-radius:50%;width:46px;height:46px;
      background:rgba(255,255,255,0.8);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:all .3s;
    }
    .mic-btn:hover{background:rgba(255,255,255,1);}
    .mic-btn.active{background:#00bfa5;color:white;box-shadow:0 0 15px rgba(0,191,165,0.7);}
    .mic-icon{font-size:22px;}
  </style>
</head>
<body>
  <!-- Main Container -->
  <div class="main-container">
    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span>Chat History</span>
      </div>
      <button class="new-chat-btn" onclick="newChat()">+ New chat</button>
      <div class="sidebar-note">Saved in this browser tab only.</div>
      <div id="chatHistoryList"></div>
    </div>

    <!-- Chat Area -->
    <div class="chat-container">
      <div class="chat-header">
        <div style="display:flex; align-items:center;">
          <button class="toggle-sidebar-btn" onclick="toggleSidebar()">☰</button>
          <h1 style="margin-left:15px;">FinTutor</h1>
          <span id="status" class="status offline">● Offline</span>
        </div>
      </div>
      <div id="chatMessages"></div>
      <div class="chat-input-area">
        <input id="chatInput" placeholder="Ask about investing, credit cards, taxes or loans..."
               onkeypress="if(event.key==='Enter') sendMessage()">
        <button class="mic-btn" id="micBtn" title="Speak"><span class="mic-icon">🎤</span></button>
        <button class="btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const STORE_KEY = "fintutor_chats";

    // Check health
    async function checkHealth(){
      try{
        const res = await fetch("/health");
        const data = await res.json();
        if(data.chatbot_ready){
          statusEl.textContent="● Online";
          statusEl.className="status ok";
        }else throw new Error();
      }catch{
        statusEl.textContent="● Offline";
        statusEl.className="status offline";
      }
    }
    checkHealth(); setInterval(checkHealth,10000);

    // Chat history lives in sessionStorage: per tab, nothing stored on the server.
    function loadChats(){
      try{ return JSON.parse(sessionStorage.getItem(STORE_KEY)) || {}; }catch{ return {}; }
    }
    function saveChats(chats){
      try{ sessionStorage.setItem(STORE_KEY, JSON.stringify(chats)); }catch{}
    }
    let chats = loadChats();
    let currentChatId = null;

    function toggleSidebar(){
      document.getElementById("sidebar").classList.toggle("collapsed");
    }

    function renderHistory(){
      const list = document.getElementById("chatHistoryList");
      list.innerHTML = "";
      Object.values(chats).sort((a,b) => b.timestamp.localeCompare(a.timestamp)).forEach(chat => {
        const item = document.createElement("div");
        item.className = "chat-history-item";
        item.textContent = chat.title;
        const when = document.createElement("small");
        when.textContent = new Date(chat.timestamp).toLocaleString();
        item.appendChild(when);
        item.onclick = () => openChat(chat.id);
        list.appendChild(item);
      });
    }

    function openChat(id){
      currentChatId = id;
      chatMessages.innerHTML = "";
      chats[id].messages.forEach(m => addChatMessage(m));
    }

    function newChat(){
      currentChatId = null;
      chatMessages.innerHTML = "";
      chatInput.focus();
    }

    // textContent, never innerHTML: messages contain user input and model output.
    function addChatMessage({text, isUser, sources, status}){
      const div = document.createElement("div");
      div.className = `message ${isUser ? "user" : "bot"}${status === "no_match" ? " no-match" : ""}`;
      const content = document.createElement("div");
      content.className = "message-content";
      content.textContent = text;
      if(sources && sources.length){
        const box = document.createElement("div");
        box.className = "sources";
        box.textContent = "Sources (similar questions from the knowledge base):";
        const ol = document.createElement("ol");
        sources.forEach(s => {
          const li = document.createElement("li");
          li.textContent = `${s.question} (similarity ${s.similarity.toFixed(2)})`;
          ol.appendChild(li);
        });
        box.appendChild(ol);
        content.appendChild(box);
      }
      div.appendChild(content);
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function record(msg){
      if(!currentChatId){
        currentChatId = `chat_${Date.now()}`;
        const title = msg.text.length > 50 ? msg.text.slice(0,50) + "..." : msg.text;
        chats[currentChatId] = {id: currentChatId, title, timestamp: new Date().toISOString(), messages: []};
      }
      chats[currentChatId].messages.push(msg);
      saveChats(chats);
      renderHistory();
    }

    async function sendMessage(){
      const text = chatInput.value.trim();
      if(!text) return;

      const userMsg = {text, isUser: true};
      addChatMessage(userMsg);
      record(userMsg);
      chatInput.value = "";

      const loading = document.createElement("div");
      loading.className = "message bot";
      loading.innerHTML = `<div class="message-content loading">
        <div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div>
      </div>`;
      chatMessages.appendChild(loading);

      let botMsg;
      try{
        const res = await fetch("/chat", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({message: text})
        });
        const data = await res.json();
        botMsg = {text: data.response || "No response.", isUser: false,
                  sources: data.sources || [], status: data.status};
      }catch{
        botMsg = {text: "Could not connect to backend.", isUser: false};
      }
      loading.remove();
      addChatMessage(botMsg);
      record(botMsg);
    }

    renderHistory();

    // Voice Recognition
    const micBtn=document.getElementById("micBtn");
    let recognition;
    if("webkitSpeechRecognition" in window){
      recognition=new webkitSpeechRecognition();
      recognition.continuous=false;
      recognition.lang="en-IN";
      recognition.interimResults=false;
      recognition.onstart=()=>micBtn.classList.add("active");
      recognition.onend=()=>micBtn.classList.remove("active");
      recognition.onresult=function(e){
        const transcript=e.results[0][0].transcript;
        chatInput.value=transcript;
        sendMessage();
      };
      micBtn.onclick=()=>recognition.start();
    }else{
      micBtn.disabled=true;
      micBtn.title="Speech recognition not supported";
    }
  </script>
</body>
</html>
